// MatchZy - Studiosgamesrs Nexus tournament defaults
// Docs: https://shobhit-pathak.github.io/MatchZy/configuration/
// Comments must use "//" - a "#" line is parsed as a command and logs "Unknown command".
// Every convar below exists in MatchZy 0.8.15, which is the version install-plugins.sh pins.
// Kept ASCII on purpose: this file is read by the game server and printed in chat.

// Sides come fixed in the match JSON (map_sides), decided on the website.
// A knife round hands the choice to whoever on the winning team types .stay/.switch
// first - MatchZy has no captain concept - and those commands double as team-join
// commands, so a player picking a side by hand desyncs the roster and the match
// never goes live. Off by default; the panel can still request it per match.
matchzy_knife_enabled_default 0

matchzy_minimum_ready_required 2
matchzy_stop_command_available 1
matchzy_whitelist_enabled_default 0
matchzy_kick_when_no_match_loaded 0

// Branding: players should see Studiosgamesrs coordinating, not the plugin.
matchzy_chat_prefix [{Gold}Studiosgamesrs{Default}]
matchzy_admin_chat_prefix [{Red}Centinela{Default}]
matchzy_show_credits_on_match_start 0
matchzy_hostname_format "Studiosgamesrs | {TEAM1} vs {TEAM2}"
matchzy_match_start_message "{Gold}Studiosgamesrs{Default} - partida oficial en marcha. Mucha suerte."

// Demos: the path must end in a slash, and the format token is {MATCH_ID}, not {MATCHID}.
matchzy_demo_path Studiosgamesrs/
matchzy_demo_name_format "{TIME}_{MATCH_ID}_{MAP}_{TEAM1}_vs_{TEAM2}"

// Normal pause, not tactical: the Sentinel is the one who resumes a match.
matchzy_use_pause_command_for_tactical_pause false
