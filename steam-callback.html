<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vinculando Steam...</title>
</head>
<body>
  <p>Procesando vinculación de Steam...</p>
  <script>
    // Página de destino para el callback de Steam OAuth.
    // El backend (steam_login.php o /auth/steam) debe redirigir aquí con ?steam=BASE64_JSON
    // Ejemplo de steam: { steamid, personaname, avatarfull, loccountrycode }
    const params = new URLSearchParams(window.location.search);
    const steamB64 = params.get('steam');
    if (steamB64) {
      try {
        const data = JSON.parse(atob(steamB64));
        localStorage.setItem('usuario_steam', JSON.stringify(data));
      } catch (e) { console.warn('Error parseando steam:', e); }
    }
    window.location.replace('/dashboard');
  </script>
</body>
</html>
