<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Iniciando sesión con Steam...</title>

  <style>

    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }

    .msg { text-align: center; padding: 2rem; max-width: 420px; }

    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #e53935; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }

    @keyframes spin { to { transform: rotate(360deg); } }

  </style>

</head>

<body>

  <div class="msg">

    <div class="spinner"></div>

    <p id="statusText">Iniciando sesión con Steam...</p>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-check-compat.js"></script>
  <script src="/sg-firebase-init.js?v=20260724nocaptcha"></script>

  <script>

    (function() {

      async function clearCommunitySw() {
        if (!('serviceWorker' in navigator)) return;
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) {
            if (r.active && r.active.scriptURL.indexOf('sw-community') !== -1) {
              return r.unregister();
            }
          }));
        } catch (e) {}
      }

      const STEAM_RESOLVE_URL = 'https://us-central1-studiosgamesrs.cloudfunctions.net/steamLoginResolve';

      if (typeof firebase === 'undefined') {

        window.location.replace('/login?steam_error=' + encodeURIComponent('Error de configuración Firebase.'));

        return;

      }

      sgInitFirebaseApp();

      const auth = firebase.auth();

      const db = firebase.database();



      const params = new URLSearchParams(window.location.search);

      const tokenParam = params.get('token');

      const steamParam = params.get('steam');

      const mode = params.get('mode') || 'login';

      const statusEl = document.getElementById('statusText');



      function saveSteam(data) {

        if (data) localStorage.setItem('usuario_steam', JSON.stringify(data));

      }



      async function persistSteamToFirebase(user, steamData) {

        if (!user || !steamData) return;

        const updates = { steam: steamData };

        if (steamData.steamid) updates.steamID = String(steamData.steamid);

        await db.ref('users/' + user.uid).update(updates);

      }



      function gotoDashboard() {

        window.location.replace('/dashboard');

      }



      function gotoLogin(msg) {

        const q = msg ? '?steam_error=' + encodeURIComponent(msg) : '';

        window.location.replace('/login' + q);

      }



      async function resolveTokenFromCloud(steamId) {

        statusEl.textContent = 'Buscando tu cuenta vinculada...';

        const res = await fetch(STEAM_RESOLVE_URL, {

          method: 'POST',

          headers: { 'Content-Type': 'application/json' },

          body: JSON.stringify({ steamId: String(steamId) })

        });

        let data = {};

        try { data = await res.json(); } catch (e) {}

        if (res.ok && data.success && data.token) return data.token;

        throw new Error(data.message || 'Tu cuenta de Steam no está vinculada. Inicia sesión con Google, vincula Steam desde el dashboard e intenta de nuevo.');

      }



      async function run() {

        await clearCommunitySw();

        let steamData = null;

        if (steamParam) {

          try { steamData = JSON.parse(atob(steamParam)); saveSteam(steamData); } catch (e) {}

        }



        let token = tokenParam;



        if (!token && mode === 'login' && steamData && steamData.steamid) {

          try {

            token = await resolveTokenFromCloud(steamData.steamid);

          } catch (e) {

            gotoLogin(e.message || 'No se pudo vincular Steam con tu cuenta.');

            return;

          }

        }



        if (!token) {

          gotoLogin('No se recibió token de sesión. Vincula Steam desde el dashboard tras iniciar con Google.');

          return;

        }



        try {

          statusEl.textContent = 'Entrando a tu cuenta...';

          const cred = await auth.signInWithCustomToken(token);

          const user = cred.user;

          if (steamData) await persistSteamToFirebase(user, steamData);

          gotoDashboard();

        } catch (e) {

          console.error('signInWithCustomToken:', e);

          gotoLogin('No se pudo iniciar sesión con Steam. Intenta con Google o Email.');

        }

      }



      run();

    })();

  </script>

</body>

</html>
