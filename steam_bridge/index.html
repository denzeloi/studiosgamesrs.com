<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Conectando Steam...</title>
	<style>
		body {
			font-family: 'Segoe UI', sans-serif;
			background: linear-gradient(180deg, rgba(0, 0, 0, 0.9), rgba(48, 0, 0, 0.8)), url('/bg_01csgo.png');
			background-size: cover; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
		}
		.wrapper {
			background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 20px; width: 350px; text-align: center;
			box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
		}
		img.steam-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #66c0f4; margin-bottom: 10px; }
		input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
		button { width: 100%; padding: 10px; background: crimson; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #66c0f4; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
	</style>
</head>
<body>

	<div class="wrapper" id="bridge-container">
        </div>

	<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-check-compat.js"></script>
	<script src="/sg-firebase-init.js?v=20260724nocaptcha"></script>
	
	<script>
		sgInitFirebaseApp();
		const auth = firebase.auth();
		const database = firebase.database();

		window.onload = function() {
            // 1. REVISAR SI VENIMOS CON UN TOKEN VIP (AUTO LOGIN)
            const customToken = localStorage.getItem('firebase_custom_token');
            if (customToken) {
                document.getElementById('bridge-container').innerHTML = `
                    <div class="spinner"></div>
                    <h3 style="color: #66c0f4;">Conectando con Steam...</h3>
                    <p style="font-size: 13px; color: #ccc;">Iniciando sesión de forma segura.</p>
                `;
                
                // LA MAGIA DE FIREBASE: Iniciar sesión automáticamente
                auth.signInWithCustomToken(customToken)
                    .then(() => {
                        localStorage.removeItem('firebase_custom_token'); // Limpiamos rastro
                        window.location.href = "dashboard.html"; // Redirige como un rey
                    })
                    .catch((error) => {
                        console.error("Error en Auto-Login:", error);
                        localStorage.removeItem('firebase_custom_token');
                        window.location.href = "login.html?steam_msg=" + encodeURIComponent("Tu sesión expiró. Intenta de nuevo.");
                    });
                
                return; // Cortamos aquí. No ejecutamos el código de abajo.
            }

            // 2. SI NO HAY TOKEN, ES UN REGISTRO NUEVO
			const steamDataStr = localStorage.getItem('usuario_steam');
			const steamIntent = localStorage.getItem('steam_intent');

			if (!steamDataStr) {
				window.location.href = 'login.html'; 
				return;
			}

			const steamUser = JSON.parse(steamDataStr);

			// Renderizamos el formulario de vinculación de correo
			document.getElementById('bridge-container').innerHTML = `
				<img src="${steamUser.avatarfull}" class="steam-avatar">
				<h2>${steamUser.personaname}</h2>
                <h3 style="margin-bottom: 15px; color: #66c0f4; margin-top: 15px;">Vincula un correo</h3>
                <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">Para completar el registro y recibir recompensas, enlaza un email y una clave.</p>
                <form id="steam-register-form">
                    <input type="email" id="link-email" placeholder="Email" required>
                    <input type="password" id="link-password" placeholder="Crea una contraseña" required>
                    <button type="submit">Completar Registro</button>
                </form>
			`;

			document.getElementById('steam-register-form').addEventListener('submit', async (e) => {
				e.preventDefault();
				const email = document.getElementById('link-email').value;
				const password = document.getElementById('link-password').value;
                const btn = e.target.querySelector('button');
                btn.innerText = "Registrando...";
                btn.disabled = true;

				try {
					// 1. Crear el usuario en Firebase
					const userCredential = await auth.createUserWithEmailAndPassword(email, password);
					const user = userCredential.user;

					// 2. Guardar datos en la BD (incluyendo el ID vital de Steam)
					await database.ref('users/' + user.uid).set({
						nick: steamUser.personaname,
						nick_lowercase: steamUser.personaname.toLowerCase(),
						photoURL: steamUser.avatarfull, 
						steamID: steamUser.steamid,     // <--- ESTO ES LO QUE BUSCA EL PHP
						steamProfile: steamUser.profileurl,
						rango: "tribal_warrior",
						registro: new Date().toISOString(),
						tokens: 10
					});

					// 3. Enviar correo de verificación
					try {
						await fetch("send_verification.php", {
							method: 'POST',
							headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
							body: new URLSearchParams({ email: email, nickname: steamUser.personaname, uid: user.uid })
						});
					} catch (err) { console.log("Error mandando email", err); }

					// 4. Limpiar LocalStorage y enviar al Dashboard Restringido (Soft Gating)
					localStorage.removeItem('usuario_steam');
					localStorage.removeItem('steam_intent');
					window.location.href = "dashboard.html";

				} catch (error) {
					alert("Error: " + error.message);
                    btn.innerText = "Completar Registro";
                    btn.disabled = false;
				}
			});
		};
	</script>
</body>
</html>
