<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista previa chip (temporal)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Orbitron:wght@400;500;700&family=Montserrat:wght@300;400;600&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared-header.css">
<link rel="stylesheet" href="shared-notifications.css">
<link rel="stylesheet" href="sg-level-badge.css">
<link rel="stylesheet" href="shared-nexus-sensor.css">
<style>
  body { background: #06080c; margin: 0; min-height: 900px; }
  .zone { display: flex; gap: 90px; padding: 60px 40px; }
  .zone-col { position: relative; }
  .zone-label { color: #8b949e; font: 12px Montserrat, sans-serif; margin-bottom: 14px; }
  .fake-actions { position: relative; display: flex; align-items: center; gap: 0.5rem; }
</style>
</head>
<body>

<header class="unified-header">
  <div class="header-brand">
    <a href="#" class="header-logo"><span class="studio">Studios</span><span class="gamesrs">gamesrs</span></a>
    <div><div class="header-subtitle">/ Dashboard del usuario</div><div class="header-version">v 2.1.2</div></div>
  </div>
  <div class="header-search"><div class="search-input-container">
    <input type="text" class="user-search-input" placeholder="🔍 Buscar usuarios...">
  </div></div>
  <div class="header-actions">
    <div class="header-notifications-wrap">
      <button type="button" class="icon-btn" id="notificationsToggleBtn" title="Notificaciones"><i class="fas fa-bell"></i></button>
    </div>
    <a href="#" class="icon-btn commander-panel-btn" id="commanderPanelBtn" title="Panel de Commander"><i class="fas fa-user-shield"></i></a>
    <button class="icon-btn" title="Cambiar tema"><i class="fas fa-palette"></i></button>
    <div class="header-account-end">
      <div class="nav-dropdown" id="navDropdown">
        <button type="button" class="nav-dropdown-trigger">
          <i class="fas fa-dragon nav-dropdown-icon"></i>
          <span class="nav-dropdown-current">Dashboard</span>
          <i class="fas fa-chevron-down nav-dropdown-chevron"></i>
        </button>
      </div>
      <button class="logout-btn">Cerrar Sesión</button>
    </div>
  </div>
</header>

<div class="zone">
  <div class="zone-col">
    <p class="zone-label">Nivel 13 · panel abierto</p>
    <div class="fake-actions" id="host13"></div>
  </div>
  <div class="zone-col">
    <p class="zone-label">Nivel 74 · panel abierto</p>
    <div class="fake-actions" id="host74"></div>
  </div>
  <div class="zone-col">
    <p class="zone-label">Nivel 100 · panel abierto</p>
    <div class="fake-actions" id="host100"></div>
  </div>
</div>

<script>window.firebase = undefined;</script>
<script src="sg-levels.js"></script>
<script src="sg-level-badge.js"></script>
<script src="shared-nexus-sensor.js"></script>
<script>
  // Reproduce lo que hace el sensor con datos falsos: mismo marcado del chip y
  // mismo generador de HTML del panel (SGNexusSensor.buildPanelHtml).
  function fakeProg(level) {
    var xp = SGLevels.xpForLevel(level) + 120;
    var p = SGLevels.progress(xp);
    return {
      xp: p.xp, level: p.level, pct: p.pct, remaining: p.remaining, maxed: p.maxed,
      nextLevel: p.nextLevel, tierName: p.tier.name, accessName: p.tier.accessName || '',
      tagline: p.tier.tagline || '', color: p.tier.color, glow: p.tier.glow
    };
  }

  [['host13', 13], ['host74', 74], ['host100', 100]].forEach(function (pair) {
    var prog = fakeProg(pair[1]);
    var wrap = document.createElement('div');
    wrap.className = 'sg-nexus-chip-wrap';
    wrap.style.setProperty('--sg-nexus-tier', prog.color);
    wrap.innerHTML =
      '<button type="button" class="sg-nexus-chip" aria-haspopup="true" aria-expanded="true">' +
        '<span class="sg-nexus-chip-badge" data-sg-nexus-badge="1"></span>' +
      '</button>' +
      '<div class="sg-nexus-panel is-open"></div>';
    document.getElementById(pair[0]).appendChild(wrap);
    SGLevelBadge.render(wrap.querySelector('[data-sg-nexus-badge]'), {
      xp: prog.xp, level: prog.level, size: 'sm', showBar: false, showTier: false, showTooltip: false
    });
    wrap.querySelector('.sg-nexus-panel').innerHTML = SGNexusSensor.buildPanelHtml(prog);
  });
</script>
</body>
</html>
