<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Preview 3D</title>
  <style>
    body { margin: 0; background: #0d0708; color: #eee; font: 13px system-ui; }
    /* Mismo hueco que .sg-welcome-stage del overlay real (620px de caja menos
       el relleno, por 340 de alto) para que el encuadre se juzgue de verdad. */
    #wrap { position: relative; width: 564px; height: 340px; margin: 30px auto;
            outline: 1px dashed rgba(255,120,60,.4); }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { max-width: 900px; margin: 0 auto; padding: 8px 12px; background: #16090b;
           white-space: pre-wrap; font: 12px ui-monospace, monospace; }
    #clips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 900px; margin: 8px auto; }
    button { font: 12px system-ui; padding: 4px 9px; }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="clips"></div>
  <div id="hud">cargando…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const q = new URLSearchParams(location.search);
    const file = q.get('f') || '/tools_tmp_wyvern/opt/wyvern-dragon.glb';
    const extra = q.get('f2') || ''; // segundo GLB: solo se le roban los clips
    const canvas = document.getElementById('c');
    const hud = document.getElementById('hud');
    const W = 564, H = 340;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);

    const preset = (q.get('lights') || 'ember');
    const RIGS = {
      ember: [0x9aa2b0, 0x9c3010, 1.35, 0xffcaa8, 1.85, [3, 5, 4], 0xff3e14, 1.2, [-4, 2, -3], 0xff5a1e, 1.6, [0, -1.7, 1.6]],
      desert: [0xbcd4ee, 0xc79a5e, 1.25, 0xfff0cf, 2.15, [3.4, 5.2, 3.2], 0xffd08a, 0.95, [-4, 2.4, -3], 0xd9a463, 0.9, [0, -1.6, 1.8]],
      storm: [0x8fa6c8, 0x2a1a2e, 1.15, 0xffe2c4, 2.3, [3.2, 5.4, 3.6], 0xff5a2a, 1.5, [-4.2, 2.2, -3.2], 0xffb066, 1.1, [0, -1.5, 2.0]],
      // Copia exacta del rig 'wyvern' de welcome-overlay.js: sin esto la prueba
      // no dice nada de como se vera en la pagina.
      wyvern: [0x8fa6c8, 0x3a0f0a, 1.15, 0xfff0d8, 2.2, [3.2, 5.4, 3.6], 0xff4a1e, 1.65, [-4.2, 2.2, -3.4], 0xff7a2a, 1.5, [0, -1.6, 1.9]],
      // Candidata mas luminosa: el dragon es casi negro y con el rig de arriba
      // se pierde contra el fondo del overlay.
      wyvern2: [0xa8c0e4, 0x5a1c10, 1.7, 0xfff4e2, 3.1, [3.2, 5.4, 3.6], 0xff5a28, 2.3, [-4.2, 2.2, -3.4], 0xff8a3a, 2.1, [0, -1.6, 1.9]]
    };
    const L = RIGS[preset] || RIGS.ember;
    scene.add(new THREE.HemisphereLight(L[0], L[1], L[2]));
    const key = new THREE.DirectionalLight(L[3], L[4]); key.position.set(...L[5]); scene.add(key);
    const rim = new THREE.DirectionalLight(L[6], L[7]); rim.position.set(...L[8]); scene.add(rim);
    const bounce = new THREE.PointLight(L[9], L[10], 16, 2); bounce.position.set(...L[11]); scene.add(bounce);

    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    let mixer = null, current = null, clips = [], root = null, bones = [];
    let geomBox = null;
    const clock = new THREE.Clock();

    /**
     * Caja que ocupa DE VERDAD el personaje mientras corre un clip: se aplica
     * la deformacion del esqueleto a una muestra de vertices en varios
     * instantes y se une todo. Es lo unico que encuadra bien a un bicho cuya
     * silueta cambia tanto (el dragon mide 17 de ancho plegado y 24 en vuelo).
     */
    function posedBox(clip, samples) {
      const box = new THREE.Box3();
      const v = new THREE.Vector3();
      const action = mixer.clipAction(clip);
      mixer.stopAllAction();
      action.reset().play();
      const n = samples || 7;
      for (let s = 0; s < n; s += 1) {
        mixer.setTime((clip.duration * s) / (n - 1));
        root.updateMatrixWorld(true);
        root.traverse((o) => {
          if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
          const pos = o.geometry.attributes.position;
          const stride = Math.max(1, Math.ceil(pos.count / 900));
          for (let i = 0; i < pos.count; i += stride) {
            v.fromBufferAttribute(pos, i);
            if (o.isSkinnedMesh && o.skeleton) o.applyBoneTransform(i, v);
            o.localToWorld(v);
            box.expandByPoint(v);
          }
        });
      }
      mixer.stopAllAction();
      mixer.setTime(0);
      return box;
    }
    window.__posedBox = (name) => {
      const clip = clips.find((c) => c.name === name);
      if (!clip) return null;
      const b = posedBox(clip);
      const s = new THREE.Vector3(); b.getSize(s);
      const inv = 1 / root.scale.x;
      return { x: +(s.x * inv).toFixed(2), y: +(s.y * inv).toFixed(2), z: +(s.z * inv).toFixed(2) };
    };

    function load(url) {
      return new Promise((res, rej) => loader.load(url, res, undefined, rej));
    }

    (async () => {
      const gltf = await load(file);
      root = gltf.scene;
      clips = gltf.animations.slice();
      if (extra) {
        // Igual que hara el visor real: los clips de otro archivo se pegan al
        // mismo modelo porque el mixer empareja las pistas por nombre de nodo.
        const g2 = await load(extra);
        clips = clips.concat(g2.animations);
      }

      const yaw = Number(q.get('yaw') || 0);
      root.rotation.y = yaw * Math.PI / 180;
      root.updateMatrixWorld(true);

      root.traverse((o) => { if (o.isBone) bones.push(o); });

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3(); box.getSize(size);
      geomBox = size.clone();

      scene.add(root);
      mixer = new THREE.AnimationMixer(root);

      const th = Number(q.get('th') || 2.4);
      const fit = q.get('fit') || 'height';
      let scale = th / size.y;
      if (fit === 'hero') {
        // Plano heroico: manda la ALTURA de la pose y se deja que la envergadura
        // se salga del cuadro hasta un tope. Un dragon visto entero es una
        // franja fina; recortarle la punta de las alas se ve mucho mejor.
        const clip = clips.find((c) => c.name === (q.get('clip') || clips[0].name)) || clips[0];
        const pb = posedBox(clip);
        const ps = new THREE.Vector3(); pb.getSize(ps);
        const pc = new THREE.Vector3(); pb.getCenter(pc);
        const fillY = Number(q.get('fy') || 0.72);
        const fillX = Number(q.get('fx') || 1.9);
        const tanY = Math.tan((camera.fov * Math.PI / 180) / 2);
        const dist = Math.max(ps.y / (2 * tanY * fillY), ps.x / (2 * tanY * camera.aspect * fillX));
        root.position.x -= pc.x;
        root.position.y -= pc.y;
        root.position.z -= pc.z;
        root.position.y -= 2 * dist * tanY * Number(q.get('drop') || 0);
        root.updateMatrixWorld(true);
        camera.position.set(0, 0, dist);
        camera.lookAt(0, 0, 0);
        window.__dist = dist;
        window.__posed = [ps.x.toFixed(2), ps.y.toFixed(2), ps.z.toFixed(2)].join(' x ');
        report(size, 1);
        finish();
        return;
      }
      if (fit === 'pose') {
        // Encuadre automatico: se mide la pose real del clip y se acerca la
        // camara justo hasta que ese rectangulo llena el cuadro.
        const clip = clips.find((c) => c.name === (q.get('clip') || clips[0].name)) || clips[0];
        const pb = posedBox(clip);
        const ps = new THREE.Vector3(); pb.getSize(ps);
        const pc = new THREE.Vector3(); pb.getCenter(pc);
        const fill = Number(q.get('fill') || 0.88);
        const tanY = Math.tan((camera.fov * Math.PI / 180) / 2);
        const dist = Math.max(ps.y / (2 * tanY), ps.x / (2 * tanY * camera.aspect)) / fill;
        // El modelo se centra en el punto que mira la camara.
        root.position.x -= pc.x;
        root.position.y -= pc.y;
        root.position.z -= pc.z;
        root.updateMatrixWorld(true);
        camera.position.set(0, 0, dist);
        camera.lookAt(0, 0, 0);
        window.__dist = dist;
        window.__posed = [ps.x.toFixed(2), ps.y.toFixed(2), ps.z.toFixed(2)].join(' x ');
        report(size, 1);
        finish();
        return;
      }
      if (fit === 'contain') {
        // Encaje real: la escala la marca el lado que peor entra en el cuadro.
        const fovY = camera.fov * Math.PI / 180;
        const tanY = Math.tan(fovY / 2);
        const aspect = camera.aspect;
        // Se busca la escala que llene una fraccion `fill` del cuadro.
        const fill = Number(q.get('fill') || 0.86);
        const kx = size.x / (2 * tanY * aspect);
        const ky = size.y / (2 * tanY);
        const dist = Math.max(kx, ky) / fill;
        scale = th / size.y; // se mantiene la referencia, la camara hara el resto
        root.scale.setScalar(scale);
        root.updateMatrixWorld(true);
        placeAndAim(scale * dist);
      } else {
        root.scale.setScalar(scale);
        root.updateMatrixWorld(true);
        placeAndAim(null);
      }

      report(size, scale);
      finish();
    })().catch((e) => { hud.textContent = 'ERROR: ' + e.message; window.__ready = 'error'; });

    function finish() {
      const holder = document.getElementById('clips');
      clips.forEach((c) => {
        const b = document.createElement('button');
        b.textContent = c.name + ' (' + c.duration.toFixed(2) + 's)';
        b.onclick = () => play(c.name);
        holder.appendChild(b);
      });
      play(q.get('clip') || clips[0].name, 0);
      window.__ready = true;
    }

    function placeAndAim(forcedDist) {
      const b2 = new THREE.Box3().setFromObject(root);
      const s2 = new THREE.Vector3(); b2.getSize(s2);
      const c2 = new THREE.Vector3(); b2.getCenter(c2);
      root.position.x -= c2.x;
      root.position.z -= c2.z;
      root.position.y -= b2.min.y - 0.55;
      const dist = forcedDist != null ? forcedDist : (s2.y * Number(q.get('df') || 1.9) + Number(q.get('dp') || 1.6));
      const camH = Number(q.get('ch') || 0.55);
      const lookH = Number(q.get('lh') || 0.42);
      camera.position.set(0, s2.y * camH, dist);
      camera.lookAt(0, s2.y * lookH, 0);
      const visibleH = 2 * dist * Math.tan((camera.fov * Math.PI / 180) / 2);
      root.position.y -= visibleH * Number(q.get('drop') || 0.15);
      root.updateMatrixWorld(true);
      window.__dist = dist;
    }

    function report(size, scale) {
      hud.textContent =
        'archivo: ' + file + (extra ? '  + clips de ' + extra : '') + '\n' +
        'bbox geometria (tras yaw): ' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2) +
        '   escala: ' + scale.toFixed(4) + '   dist camara: ' + (window.__dist || 0).toFixed(2) +
        (window.__posed ? '   pose: ' + window.__posed : '') + '\n' +
        'clips: ' + clips.map((c) => c.name + ' ' + c.duration.toFixed(2) + 's').join(' | ');
    }

    function play(name, fade) {
      const clip = clips.find((c) => c.name === name);
      if (!clip || !mixer) return;
      const next = mixer.clipAction(clip);
      next.reset().setEffectiveWeight(1).play();
      if (current && current !== next) current.crossFadeTo(next, fade == null ? 0.35 : fade, false);
      current = next;
      window.__clip = name;
    }
    window.__play = play;
    window.__seek = (t) => { if (mixer) { mixer.setTime(t); renderer.render(scene, camera); } };

    /** Caja que ocupan los HUESOS en un instante: refleja la pose real. */
    window.__boneBox = (name, t) => {
      play(name, 0);
      mixer.setTime(t);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3();
      const v = new THREE.Vector3();
      for (const b of bones) box.expandByPoint(v.setFromMatrixPosition(b.matrixWorld));
      const s = new THREE.Vector3(); box.getSize(s);
      const inv = 1 / root.scale.x;
      return { x: +(s.x * inv).toFixed(2), y: +(s.y * inv).toFixed(2), z: +(s.z * inv).toFixed(2) };
    };
    window.__geomBox = () => geomBox && { x: +geomBox.x.toFixed(2), y: +geomBox.y.toFixed(2), z: +geomBox.z.toFixed(2) };

    (function loop() {
      requestAnimationFrame(loop);
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
