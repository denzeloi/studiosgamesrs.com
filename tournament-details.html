<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Details - Studiosgamesrs</title>
  <link rel="icon" href="dragon_profile_studiosgamesrs.png" type="image/png" />
  <link rel="stylesheet" href="dashboard-styles.css">
  <link rel="stylesheet" href="shared-header.css">
  <link rel="stylesheet" href="shared-notifications.css?v=20260711d">
  <link rel="stylesheet" href="competition-hub.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"></script>
  <script src="/sg-firebase-init.js?v=20260724nocaptcha"></script>
  <script src="cs2-bridge-config.js?v=20260726a"></script>
  <script src="tournament-system.js?v=20260727h"></script>
  <style>
    .td-wrap { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .td-header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .td-title { font-size: 1.8rem; color: #ffca3a; margin: 0; }
    .td-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .td-grid { grid-template-columns: 1fr; } }
    .td-card { background: rgba(20,20,30,0.9); border: 1px solid #333; border-radius: 12px; padding: 1.25rem; }
    .td-card h3 { margin: 0 0 1rem; color: #fff; font-size: 1rem; }
    .td-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }
    .td-status.live { background: #e53935; color: #fff; }
    .td-status.pending { background: #555; color: #fff; }
    .td-status.finished { background: #333; color: #aaa; }
    .td-score { font-size: 2rem; font-weight: bold; text-align: center; color: #ffca3a; }
    .td-roster { list-style: none; padding: 0; margin: 0; }
    .td-roster li { padding: 6px 0; border-bottom: 1px solid #222; color: #ccc; }
    .td-bracket-match { padding: 8px; margin: 4px 0; background: #111; border-radius: 6px; font-size: 0.9rem; }
    .td-bracket-match.active { border: 1px solid #ffca3a; }
    .td-admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
    .td-btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: opacity 0.2s ease; }
    .td-btn-primary { background: #ffca3a; color: #000; }
    .td-btn-danger { background: #e53935; color: #fff; }
    .td-btn-secondary { background: #333; color: #fff; }
    .td-btn:disabled, .td-btn-disabled { opacity: 0.45; cursor: not-allowed; }
    .td-btn-loading { opacity: 0.85; cursor: wait; }
    .td-connect { font-family: monospace; background: #111; padding: 10px; border-radius: 8px; color: #4caf50; word-break: break-all; }
    .td-connect-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .td-connect-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; font-size: 0.85rem; }
    .td-connect-btn:hover { background: #333; }
    .td-connect-steps { font-size: 0.82rem; color: #bbb; line-height: 1.55; margin-top: 10px; }
    .td-connect-warn { font-size: 0.82rem; color: #ffb74d; margin-top: 10px; padding: 8px; background: rgba(255,183,77,0.08); border-radius: 6px; border: 1px solid rgba(255,183,77,0.25); }
    .td-connect-wait { font-size: 0.85rem; color: #888; margin-top: 1rem; }
    .td-kills-table { width: 100%; font-size: 0.85rem; color: #aaa; }
    .td-kills-table td { padding: 4px 8px; }

    /* Panel publico en vivo: premios, podio, calendario, vigilancia */
    .td-card-wide { grid-column: 1 / -1; }
    .td-note-banner { display: none; gap: 10px; align-items: flex-start; padding: 12px 14px; margin-bottom: 1rem;
      background: rgba(255,202,58,0.08); border: 1px solid rgba(255,202,58,0.35); border-radius: 10px; color: #ffca3a; font-size: 0.9rem; }
    .td-note-banner i { margin-top: 2px; }
    .td-note-by { display: block; margin-top: 4px; font-size: 0.75rem; color: #b0a06a; }
    .td-kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .td-kv { padding: 8px 10px; background: rgba(0,0,0,0.3); border: 1px solid #2a2a2a; border-radius: 8px; }
    .td-kv-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: #777; margin-bottom: 3px; }
    .td-kv-value { font-size: 0.92rem; font-weight: 600; color: #eee; overflow-wrap: break-word; }
    .td-podium { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 1rem; }
    .td-podium-card { padding: 12px; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid #2a2a2a; border-radius: 10px; }
    .td-podium-card i { font-size: 1.4rem; }
    .td-podium-1 { border-color: rgba(255,202,58,0.4); } .td-podium-1 i { color: #ffca3a; }
    .td-podium-2 { border-color: rgba(200,210,220,0.3); } .td-podium-2 i { color: #cfd8dc; }
    .td-podium-3 { border-color: rgba(205,127,50,0.35); } .td-podium-3 i { color: #d9a06b; }
    .td-podium-place { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: #777; margin: 5px 0 3px; }
    .td-podium-team { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .td-podium-prize { margin-top: 4px; font-size: 0.82rem; font-weight: 600; color: #ffca3a; }
    .td-sched-row { display: grid; grid-template-columns: 72px 90px 1fr auto; gap: 10px; align-items: center;
      padding: 9px 10px; margin-bottom: 5px; background: rgba(0,0,0,0.3); border: 1px solid #2a2a2a;
      border-left: 3px solid #444; border-radius: 8px; font-size: 0.85rem; }
    .td-sched-row.live { border-left-color: #e53935; background: rgba(229,57,53,0.07); }
    .td-sched-row.done { opacity: 0.7; }
    .td-sched-time { font-weight: 700; color: #ffca3a; }
    .td-sched-time span { display: block; font-size: 0.66rem; font-weight: 400; color: #777; }
    .td-sched-round { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
    .td-sched-teams { color: #ddd; min-width: 0; }
    .td-sched-teams b { color: #ffca3a; }
    .td-sched-state { font-size: 0.75rem; color: #888; white-space: nowrap; }
    .td-watcher-row { display: flex; gap: 9px; align-items: center; padding: 6px 9px; margin-bottom: 5px;
      background: rgba(0,0,0,0.3); border: 1px solid #2a2a2a; border-radius: 8px; font-size: 0.85rem; color: #ddd; }
    .td-watcher-role { margin-left: auto; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
    .td-sentinel-line { display: flex; gap: 9px; align-items: center; padding: 9px 11px; margin-bottom: 0.9rem;
      background: rgba(76,175,80,0.08); border: 1px solid rgba(76,175,80,0.28); border-radius: 10px; color: #a5d6a7; font-size: 0.87rem; }
    @media (max-width: 700px) {
      .td-sched-row { grid-template-columns: 66px 1fr; }
      .td-sched-round, .td-sched-state { display: none; }
    }
  </style>
</head>
<body>
  <header class="unified-header">
    <div class="header-brand">
      <a href="/dashboard" class="header-logo"><span class="studio">Studios</span><span class="gamesrs">gamesrs</span></a>
      <div><div class="header-subtitle">/ Tournament</div></div>
    </div>
    <div class="header-actions">
      <a href="competition-hub.html" class="icon-btn" title="Back to Hub"><i class="fas fa-arrow-left"></i></a>
    </div>
  </header>

  <div class="td-wrap">
    <div class="td-header">
      <div>
        <h1 class="td-title" id="tdName">Loading...</h1>
        <span class="td-status pending" id="tdStatus">pending</span>
      </div>
      <div id="tdAdminBar" style="display:none;">
        <select id="tdMapSelect" class="modal-input" style="width:auto;">
          <option value="de_mirage">de_mirage</option>
          <option value="de_inferno">de_inferno</option>
          <option value="de_nuke">de_nuke</option>
          <option value="de_ancient">de_ancient</option>
          <option value="de_anubis">de_anubis</option>
        </select>
      </div>
    </div>

    <div class="td-note-banner" id="tdNoteBanner"></div>

    <div class="td-grid">
      <div class="td-card td-card-wide">
        <h3><i class="fas fa-trophy"></i> Premios en vivo</h3>
        <div class="td-podium" id="tdPodium"></div>
        <div class="td-kv-grid" id="tdPrizes"></div>
      </div>

      <div class="td-card td-card-wide">
        <h3><i class="fas fa-calendar-alt"></i> Calendario del torneo</h3>
        <div id="tdSchedule"></div>
      </div>

      <div class="td-card">
        <h3><i class="fas fa-eye"></i> Quien esta viendo</h3>
        <div class="td-sentinel-line" id="tdSentinelLine" style="display:none;"></div>
        <div id="tdWatchers"></div>
      </div>

      <div class="td-card">
        <h3><i class="fas fa-broadcast-tower"></i> Live Match</h3>
        <div class="td-score" id="tdScore">— : —</div>
        <p style="text-align:center;color:#888;font-size:0.85rem;" id="tdRound">Round —</p>
        <p style="text-align:center;color:#888;font-size:0.85rem;" id="tdDuration">Duration: —</p>
        <div class="td-connect" id="tdConnectInfo" style="display:none;margin-top:1rem;"></div>
        <table class="td-kills-table" id="tdKillsTable" style="margin-top:1rem;display:none;">
          <tbody id="tdKillsBody"></tbody>
        </table>
      </div>

      <div class="td-card">
        <h3><i class="fas fa-sitemap"></i> Bracket</h3>
        <div id="tdBracket">No bracket yet.</div>
      </div>

      <div class="td-card">
        <h3><i class="fas fa-users"></i> Registered Teams</h3>
        <ul class="td-roster" id="tdTeams"></ul>
      </div>

      <div class="td-card">
        <h3><i class="fas fa-info-circle"></i> Details</h3>
        <p id="tdMeta" style="color:#aaa;line-height:1.6;"></p>
        <div class="td-admin-actions" id="tdAdminActions" style="display:none;">
          <button class="td-btn td-btn-secondary" id="tdBtnCheck" style="display:none;"><i class="fas fa-sync"></i> Check Readiness</button>
          <button class="td-btn td-btn-primary" id="tdBtnProvision"><i class="fas fa-server"></i> Provision Server</button>
          <button class="td-btn td-btn-primary" id="tdBtnLaunch"><i class="fas fa-play"></i> Launch Match</button>
          <button class="td-btn td-btn-danger" id="tdBtnShutdown"><i class="fas fa-power-off"></i> Shutdown Server</button>
        </div>
        <p id="tdAdminMsg" style="color:#ffca3a;font-size:0.85rem;margin-top:8px;"></p>
      </div>
    </div>
  </div>

  <script src="tournament-details.js?v=20260729timing"></script>
</body>
</html>
